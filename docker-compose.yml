
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: QdrantDatabase
    ports:
      - "6333:6333" #Puerto para la API de Qdrant
      - "6334:6334" #Puerto gRPC para la API de Qdrant esto lo que hace es que permite que otros servicios se conecten a Qdrant a través de gRPC, lo cual es mucho mas eficiente que HTTP en términos de rendimiento y latencia.
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_QDRANT_URL: http://qdrant:6333
      APP_DB_URL: sqlite:////data/agent4u.db
      APP_REDIS_URL: redis://redis:6379
      APP_UPLOAD_DIR: /uploads
      APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY}
    volumes:
      - api_data:/data
      - model_cache:/models
      - uploads_data:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      # El lifespan carga los modelos (e5-large, bm25, cross-encoder) antes de
      # aceptar peticiones, y la primera vez los descarga. Con 15s Docker la
      # daba por muerta a mitad. Un margen largo no retrasa nada: en cuanto
      # /health responde, pasa a healthy.
      start_period: 10m
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      APP_QDRANT_URL: http://qdrant:6333
      APP_DB_URL: sqlite:////data/agent4u.db
      APP_REDIS_URL: redis://redis:6379
      APP_UPLOAD_DIR: /uploads
      APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY}
    volumes:
      - api_data:/data
      - model_cache:/models
      - uploads_data:/uploads
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_BACKEND_URL: http://api:8000
    healthcheck:
      # Una consulta real y minima. Un GET a /graphql sin query y sin
      # "Accept: text/html" (urllib no lo manda) devuelve 400.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/graphql?query=%7B__typename%7D')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  # Build de produccion (bundle estatico + nginx), no desarrollo: para trabajar
  # en el frontend sigue siendo mejor `npm run dev`. Va en un perfil para que
  # `docker compose up` no lo construya; se activa con --profile frontend.
  frontend:
    build: ./frontend
    profiles: ["frontend"]
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  qdrant_data:
  api_data:
  model_cache:
  redis_data:
  uploads_data:
