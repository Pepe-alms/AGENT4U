
# La configuracion que comparten api y worker, definida una sola vez. Si
# divergen (otra base, otra carpeta de modelos), se indexa con una y se consulta
# con otra sin que nada falle. Los valores ${...} salen del .env de la RAIZ del
# repo (ver .env.example), no de backend/.env.
x-backend-env: &backend-env
  APP_QDRANT_URL: http://qdrant:6333
  APP_DB_URL: sqlite:////data/agent4u.db
  APP_REDIS_URL: redis://redis:6379
  APP_UPLOAD_DIR: /uploads
  APP_MODELOS_DIR: /models
  APP_CONTENIDOS_DIR: /contenidos
  APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY}

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: QdrantDatabase
    ports:
      - "6333:6333" #Puerto para la API de Qdrant
      - "6334:6334" #Puerto gRPC para la API de Qdrant esto lo que hace es que permite que otros servicios se conecten a Qdrant a través de gRPC, lo cual es mucho mas eficiente que HTTP en términos de rendimiento y latencia.
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment: *backend-env
    volumes:
      - api_data:/data
      # La misma carpeta de modelos que usa el backend fuera de Docker: una
      # sola copia en disco. AGENT4U_MODELOS en el .env de la raiz la cambia.
      - ${AGENT4U_MODELOS:-~/.cache/agent4u/modelos}:/models
      - uploads_data:/uploads
      # El worker escribe el contenido de cada documento al indexarlo y la API
      # lo sirve: los dos tienen que ver el mismo volumen.
      - contenidos_data:/contenidos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      # /health no responde hasta que el lifespan termina: migrar la base y
      # cargar e5-large, BM25 y el reranker (~20 s con la cache llena) o
      # descargarlos (~3 GB, minutos) la primera vez. Durante start_period los
      # fallos no cuentan, y en cuanto responde pasa a healthy: un margen
      # largo no retrasa nada. start_interval sondea mas a menudo mientras.
      start_period: 15m
      start_interval: 5s
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - api_data:/data
      # La misma carpeta de modelos que usa el backend fuera de Docker: una
      # sola copia en disco. AGENT4U_MODELOS en el .env de la raiz la cambia.
      - ${AGENT4U_MODELOS:-~/.cache/agent4u/modelos}:/models
      - uploads_data:/uploads
      # El worker escribe el contenido de cada documento al indexarlo y la API
      # lo sirve: los dos tienen que ver el mismo volumen.
      - contenidos_data:/contenidos
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_BACKEND_URL: http://api:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8080/graphql', headers={'Accept': 'text/html'}))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  # Build de produccion (bundle estatico + nginx), no desarrollo: para trabajar
  # en el frontend sigue siendo mejor `npm run dev`. Va en un perfil para que
  # `docker compose up` no lo construya; se activa con --profile frontend.
  frontend:
    build: ./frontend
    profiles: ["frontend"]
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  qdrant_data:
  api_data:
  redis_data:
  uploads_data:
  contenidos_data:
