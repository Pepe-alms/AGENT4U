# Servir AGENT4U como SPA.
#
# El problema que resuelve `try_files`: el sitio tiene rutas reales
# (/arquitectura, /tecnologias/...), pero en el disco solo existe index.html.
# Sin esta linea, recargar en /arquitectura o abrir un enlace compartido
# devuelve 404 del servidor, porque nginx busca un fichero que no esta.
#
# Con ella, nginx sirve index.html para cualquier ruta que no sea un fichero y
# el router de React resuelve la ruta en el navegador.
#
# `vite preview` y `vite dev` ya hacen esto por su cuenta: esta configuracion
# es para produccion.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Los assets llevan hash en el nombre, asi que se pueden cachear para
  # siempre. index.html NO: es el que cambia cuando cambia el hash.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # La API, al backend. Sin esto el frontend tendria que apuntar a otro origen
  # y haria falta CORS.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # El stream de respuesta es SSE: sin estas tres lineas nginx lo almacena
    # en bufer y la respuesta llega de golpe al final, no token a token.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Todo lo demas: el fichero si existe, si no la SPA.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
