[project]
name = "agent4u-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.118.1",
    "dotenv>=0.9.9",
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "langgraph>=1.2.11",
    "litellm>=1.96.0",
    "numpy>=2.5.1",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.52",
    "transformers>=5.8.1",
    "uvicorn[standard]>=0.51.0",
]

# Definimos la cabecera de pytest para cuando se lance uv. 
# Con la funcion auto, el plug in lo que va a hacer es ejecutar todas las funciones asyncornas

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Los ficheros *_test.py en tests/ son scripts manuales (llaman a servicios
# reales: LLM, Qdrant), no tests de pytest; sin este filtro, pytest los
# recolecta igualmente por el patron *_test.py y rompe la recoleccion si
# alguno tiene un import obsoleto.
python_files = ["test_*.py"]


[tool.ruff]
line-length = 200

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]
