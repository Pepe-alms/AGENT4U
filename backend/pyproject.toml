[project]
name = "agent4u-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.118.1",
    "fastapi>=0.139.2",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "uvicorn[standard]>=0.51.0",
]

# Definimos la cabecera de pytest para cuando se lance uv. 
# Con la funcion auto, el plug in lo que va a hacer es ejecutar todas las funciones asyncornas

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.ruff]
line-length = 200

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]
