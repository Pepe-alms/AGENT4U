# Solo para la linea de comandos en desarrollo (crear revisiones nuevas):
#   uv run alembic revision --autogenerate -m "que cambia"
# La app no lee este fichero: migra al arrancar con app.db.migrar.migrar(),
# que configura Alembic por codigo. La URL sale de Settings (APP_DB_URL).
[alembic]
script_location = app/db/migraciones
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
